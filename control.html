<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prop Trader Edge — Overlay Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#ff8c4a;--accent2:#d9741d;--bg:#050f1d;--panel:#0e2039;--panel2:#122540;
        --line:#1e3555;--txt:#dfe9f7;--muted:#93aac9;--red:#ff5a6e;
        --font:'Montserrat','Helvetica Neue',Arial,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:clip}
  body{position:fixed;inset:0;background:var(--bg);color:var(--txt);font-family:var(--font);display:flex;flex-direction:column;overflow:clip;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)} a:hover{color:#ffab5c}

  header{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:#04101f}
  header .logo{display:flex;align-items:center;gap:10px}
  header .logo b{font-weight:800;font-size:18px;letter-spacing:.02em}
  header .logo span{font-weight:500;font-size:12px;letter-spacing:.22em;color:var(--muted)}
  header .sub{margin-left:6px;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  header .links{margin-left:auto;display:flex;gap:8px}
  header .links a{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:7px;text-decoration:none}
  header .links a:hover{border-color:var(--accent);color:var(--accent)}

  /* preview */
  #previewWrap{flex:0 0 auto;position:sticky;top:0;z-index:5;background:
      repeating-conic-gradient(#0a1728 0% 25%,#0e1c32 0% 50%) 0/24px 24px;
      border-bottom:1px solid var(--line);display:flex;justify-content:center;align-items:center;
      padding:10px;max-height:42vh;overflow:hidden}
  #previewBox{position:relative;width:100%;max-width:min(100%, calc((42vh - 20px) * 1.7778));aspect-ratio:16/9;
      background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #previewBox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #pvBadge{position:absolute;left:10px;top:10px;z-index:3;background:rgba(0,0,0,.6);border:1px solid var(--line);
      border-radius:20px;padding:5px 12px;font-size:11px;letter-spacing:.1em;color:var(--muted);display:flex;gap:8px;align-items:center}
  #pvBadge .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  #pvBadge.paused .dot{background:var(--red);box-shadow:none}

  /* tabs */
  nav{flex:0 0 auto;display:flex;gap:2px;padding:0 14px;background:#04101f;border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{background:none;border:none;color:var(--muted);font-family:var(--font);font-weight:700;font-size:13px;
      letter-spacing:.03em;padding:13px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  nav button:hover{color:var(--txt)}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent)}

  main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 20px 20px}
  .tab{display:none}
  .tab.active{display:block}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:800}
  .card.hl{animation:hl 1.4s ease}
  @keyframes hl{0%{box-shadow:0 0 0 0 var(--accent),inset 0 0 0 1px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

  .row{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
  .row:last-child{margin-bottom:0}
  label.lbl{font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:600}
  input[type=text],input[type=url],input[type=number],textarea,select{
      width:100%;background:#08152a;border:1px solid var(--line);border-radius:7px;color:var(--txt);
      font-family:var(--font);font-size:14px;padding:9px 10px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:76px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

  .sw{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--txt);cursor:pointer;user-select:none}
  .sw input{position:absolute;opacity:0;pointer-events:none}
  .sw .track{width:38px;height:22px;border-radius:20px;background:#233b5c;position:relative;transition:.15s;flex:0 0 auto}
  .sw .track::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#6d87ad;transition:.15s}
  .sw input:checked+.track{background:var(--accent)}
  .sw input:checked+.track::after{background:#0d1e38;transform:translateX(16px)}

  input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--line);border-radius:7px;background:#08152a;cursor:pointer}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .rangeval{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:12px}

  .swatches{display:flex;flex-wrap:wrap;gap:7px}
  .swatch{width:34px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer}
  .swatch.on{border-color:#fff}
  .btn{background:#132846;border:1px solid var(--line);color:var(--txt);font-family:var(--font);font-weight:700;
      font-size:13px;padding:9px 13px;border-radius:8px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.sm{padding:6px 9px;font-size:11px}

  /* box rows in Layout tab */
  .boxrow{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .boxrow.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .boxrow .head{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;user-select:none}
  .boxrow:not(.open) .head{margin-bottom:0}
  .boxrow:not(.open) .ctl{display:none}
  .boxrow .caret{color:var(--muted);font-size:11px;transition:transform .15s;flex:0 0 auto}
  .boxrow.open .caret{transform:rotate(90deg)}
  .boxrow .head b{font-size:14px;font-weight:800}
  .boxrow .head .tag{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:20px}
  .boxrow .head .sw{margin-left:auto}
  .boxrow .ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
  .boxrow .url{grid-column:1/-1;display:flex;gap:7px;align-items:center}
  .boxrow .url input{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
  .card .url input{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);flex:1}
  .mini{font-size:10px;color:var(--muted);letter-spacing:.05em}
  .symsearch{position:relative}
  .symres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;z-index:40;max-height:280px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .symres .ri{display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer;font-size:12px}
  .symres .ri:hover{background:rgba(255,255,255,.05)}
  .symres .ri b{font-family:ui-monospace,monospace;font-size:12px;flex:0 0 auto}
  .symres .ri .nm{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
  .symres .ty{flex:0 0 auto;font-size:8px;letter-spacing:.1em;border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--muted)}
  .symres .ty.crypto{color:#e8b64c;border-color:#5c4a1e}
  .symres .ty.etf{color:#6cb1ff;border-color:#274a72}
  .symres .ty.forex{color:#c98bf0;border-color:#4d2f63}
  .symres .ty.raw{color:var(--accent);border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chipx{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:12px}
  .chipx b{font-family:ui-monospace,monospace;font-weight:700}
  .chipx .mini{font-size:9px}
  .chipx button{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 7px;border-radius:50%}
  .chipx button:hover{color:var(--red);background:rgba(255,90,110,.12)}

  /* bottom bar */
  footer{flex:0 0 auto;display:flex;align-items:center;gap:clamp(3px,.7vw,10px);padding:10px clamp(6px,1.2vw,18px);
      background:#04101f;border-top:1px solid var(--line);flex-wrap:nowrap;overflow:hidden}
  footer .preset{display:flex;align-items:center;gap:clamp(3px,.6vw,9px);flex:0 1 auto;min-width:0;
      border:1px solid var(--line);border-radius:12px;padding:7px clamp(5px,.8vw,11px)}
  footer .plabel{font-size:clamp(8px,1vw,12px);font-weight:800;letter-spacing:.14em;color:var(--muted);white-space:nowrap;flex:0 0 auto}
  footer input.presetIn{background:#0a1728;border:1px solid #2c4a72;color:var(--txt);font-family:var(--font);
      font-weight:600;font-size:clamp(11px,1.2vw,14px);padding:8px 10px;border-radius:8px;
      width:clamp(88px,12vw,210px);flex:1 1 auto;min-width:72px;outline:none}
  footer input.presetIn::placeholder{color:#6a86a8}
  footer input.presetIn:focus{border-color:var(--accent)}
  footer .fbtn{background:#132846;border:1px solid var(--line);color:var(--txt);font-family:var(--font);font-weight:700;
      font-size:clamp(10px,1.15vw,13px);padding:8px clamp(3px,.8vw,13px);border-radius:8px;cursor:pointer;white-space:nowrap;
      display:inline-flex;gap:6px;align-items:center;flex:0 0 auto}
  footer .fbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  footer .fbtn:disabled{opacity:.4;cursor:default}
  footer .fbtn.icon{padding:8px clamp(7px,1vw,10px)}
  footer .fbtn.warn{color:var(--red)}
  footer .fbtn.warn:hover:not(:disabled){border-color:var(--red);color:var(--red);background:#33131c}
  footer .fbtn.primary{background:transparent;border-color:#2c4a72;color:var(--txt)}
  footer .fbtn.primary:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  /* left status / publish control */
  footer .status{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
      width:22px;height:26px;padding:0;border:none;cursor:default;background:none}
  footer .status .dot{width:13px;height:13px;border-radius:50%;flex:0 0 auto;transition:background .2s,box-shadow .2s}
  footer .status.saved .dot{background:#2fd07a;box-shadow:0 0 9px #2fd07a}
  footer .status.dirty .dot{background:#eab308;box-shadow:0 0 10px #eab308}
  footer .fbtn.update{background:var(--accent);border-color:var(--accent);color:#0d1e38}
  footer .fbtn.update:hover:not(:disabled){background:#ffab5c;border-color:#ffab5c;color:#0d1e38}
  footer .fbtn.update:disabled{opacity:.4}
  footer .sp{flex:1 1 auto;min-width:0}
  footer .combo{position:relative;display:flex;align-items:center;flex:1 1 auto;min-width:80px;max-width:210px}
  footer .combo .presetIn{width:100%;padding-right:24px}
  footer .comboArrow{position:absolute;right:1px;top:50%;transform:translateY(-50%);background:none;border:none;
      color:var(--muted);cursor:pointer;font-size:11px;padding:6px 7px;line-height:1}
  footer .comboArrow:hover{color:var(--accent)}
  footer .preset-pop{position:fixed;width:200px;background:#0c1c33;border:1px solid #2c4a72;
      border-radius:9px;padding:5px;display:none;max-height:230px;overflow-y:auto;z-index:200;box-shadow:0 -14px 38px rgba(0,0,0,.6)}
  footer .preset-pop.open{display:block}
  footer .preset-pop button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);
      font-family:var(--font);font-weight:600;font-size:13px;padding:8px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  footer .preset-pop button:hover{background:#152f4f;color:var(--accent)}
  footer .preset-pop .empty{color:var(--muted);font-size:12px;padding:8px 10px;font-weight:500}

  .toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);opacity:0;
      background:#0e2039;border:1px solid var(--accent);color:var(--accent);padding:10px 18px;border-radius:10px;
      font-weight:700;font-size:13px;transition:.25s;pointer-events:none;z-index:99}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .hintbar{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5}
</style>
<script src="config/settings.js"></script>
</head>

<style>
  :root{

    --border:rgba(246,199,51,.30); --line:#242424; --steel:#8a8a8a; --up:#2fd07a; --dn:#ff5a6e;

  .item{position:absolute;cursor:move}

    function sponsorList(){ return (S&&S.content&&S.content.sponsors)||[]; }

    /* ---------- sponsor rotation ----------
       Cycles the chosen slot through a shortlist of sponsors on a timer.
       Runtime only: it never writes to state, so it cannot dirty your draft
       or fight the Update button. */
    var ROT={timer:null,sig:null,i:-1,cur:{}};
    function rotCfg(){var r=S&&S.content&&S.content.sponsorRotate;return (r&&r.enabled)?r:null;}
    function rotIds(){
      var r=rotCfg(); if(!r)return [];
      var have={},L=sponsorList(),i;
      for(i=0;i<L.length;i++)have[L[i].id]=1;
      var ids=(r.ids||[]).filter(function(x){return have[x];});
      return ids.length>1?ids:[];
    }
    function rotSlots(){var r=rotCfg(),s=(r&&r.slot)||"side";return s==="both"?["side","top"]:[s];}
    function activeSponsorId(slot){
      if(ROT.cur[slot])return ROT.cur[slot];
      return S.content[slot==="top"?"topSponsor":"sideSponsor"];
    }
    function rotStep(){
      var ids=rotIds(); if(!ids.length)return;
      ROT.i=(ROT.i+1)%ids.length;
      rotSlots().forEach(function(s){
        ROT.cur[s]=ids[ROT.i];
        rerenderBox(s==="top"?"topbar":"affiliate",true);
      });
    }
    function ensureRotate(){
      var r=rotCfg(), sg=r?JSON.stringify([r.seconds,r.slot,r.ids,sponsorList().length]):"off";
      if(sg===ROT.sig)return;
      ROT.sig=sg;
      if(ROT.timer){clearInterval(ROT.timer);ROT.timer=null;}
      if(!rotIds().length){
        var had=ROT.cur; ROT.cur={}; ROT.i=-1;
        if(had.side)rerenderBox("affiliate",false);
        if(had.top)rerenderBox("topbar",false);
        return;
      }
      ROT.i=-1; rotStep();
      ROT.timer=setInterval(rotStep,Math.max(3,parseInt(r.seconds,10)||60)*1000);
    }
    function sponsorBy(id){
      var l=sponsorList(),i;
      for(i=0;i<l.length;i++){ if(l[i].id===id) return l[i]; }
      return l[0]||null;
    }

    function sponsorLogo(sp){ return sp ? (sp.logo || SPONSOR_LOGOS[sp.logoKey||sp.id] || "") : ""; }

      return '<img src="'+src+'" style="max-height:'+maxH+'px;max-width:'+maxW+'px;object-fit:contain;display:block" alt="">';
    }

    /* ---------- Companion / HTTP bridge client (Server-Sent Events) ----------

    (function(){

      function applyCmd(d){
        if(!d)return;
        // Whole-state relay (the control page pushes this when it publishes) —
        // this is what carries branding/preset changes into the OBS browser source.
        if(d.cmd==="state"){ if(d.state)PG.replaceState(d.state); return; }
        if(d.cmd==="preset"){ PG.loadPreset(d.name); return; }
        if(d.cmd==="publish"){
          var dr=null; try{ dr=JSON.parse(localStorage.getItem(PG.KEYS.draft)); }catch(e){}
          if(dr)PG.replaceState(dr);

          if(key.indexOf("ci:")===0){ var id=key.slice(3); (s.canvasItems||[]).forEach(function(it){ if(it.id===id)it.hidden=!vis; }); }
          else if(s.boxes[key]){ s.boxes[key].visible=vis; }
        });
      }
      function connect(){
        var es; try{ es=new EventSource(base+"/events"); }catch(e){ return; }
        es.addEventListener("cmd",function(ev){ try{ applyCmd(JSON.parse(ev.data)); }catch(e){} });
        es.onerror=function(){ /* EventSource auto-reconnects; stay quiet offline */ };
      }
      connect();
      // Only the real OBS overlay reports authoritative visibility to the bridge.
      if(window.__PG_MODE==="overlay"){
        var rt=null;

            var map={}; Object.keys(S.boxes||{}).forEach(function(k){ map[k]=!!S.boxes[k].visible; });
            (S.canvasItems||[]).forEach(function(it){ map["ci:"+it.id]=!it.hidden; });
            try{ fetch(base+"/report",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(map)}); }catch(e){}

      var guides=[],T=10;

      Object.keys(S.boxes).forEach(function(k){if(k===key||!S.boxes[k].visible)return;var o=S.boxes[k];targets.vx.push(o.x,o.x+o.w/2,o.x+o.w);targets.hy.push(o.y,o.y+o.h/2,o.y+o.h);});

        var top=sorted[0], low=sorted[sorted.length-1];

    /* Per-provider allowance. perMin is calls/minute; perDay caps the slow free

    /* Reserve up to `need` calls and return how many were granted. Always grants
       at least one when the window is empty, so a watchlist larger than the
       per-minute allowance still makes progress instead of deadlocking. */
    function rateTake(provider,need){
      var lim=rateLim(provider); if(!lim)return need;

      try{hist=JSON.parse(localStorage.getItem(K))||[];}catch(e){}

      var grant=Math.min(need,free);
      if(grant<=0&&hist.length===0)grant=Math.min(need,Math.max(1,lim));  // never stall
      for(var i=0;i<grant;i++)hist.push(now);
      try{localStorage.setItem(K,JSON.stringify(hist));}catch(e){}

      try{rec=JSON.parse(localStorage.getItem(K));}catch(e){}
      if(!rec||rec.d!==today)rec={d:today,n:0};
      var grant=Math.max(0,Math.min(need,r.perDay-rec.n));
      rec.n+=grant;
      try{localStorage.setItem(K,JSON.stringify(rec));}catch(e){}

      var r=RATE_LIMITS[provider]; if(!r||!r.perDay)return null;
      var rec=null; try{rec=JSON.parse(localStorage.getItem("pte_day_"+provider));}catch(e){}

    function fetchProvider(c){

         so a list longer than the allowance fills in over successive refreshes

      var grant=rateTake(c.provider,syms.length);

      var p = this.state.presets && this.state.presets[name];
      if (!p) return true;
      var cur = clone(this.state); delete cur.presets;
      return JSON.stringify(cur) !== JSON.stringify(p);
    },

    KEYS: { published: LS_KEY, draft: DRAFT_KEY },

    // Adopt a whole state object pushed from elsewhere (bridge relay, URL publish).
    replaceState: function (obj) {
      if (!obj) return false;
      this.state = deepMerge(this._default, obj);
      this._persist(); this._emit(true);
      return true;
    },

    // URL command handling (StreamDeck). Returns the command applied.
    applyUrlCommand: function () {
      var q = new URLSearchParams(global.location.search);
      var key = q.get("toggle") || q.get("show") || q.get("hide");
      if (!key || !this.state.boxes[key]) return null;
      var mode = q.has("toggle") ? "toggle" : (q.has("show") ? "show" : "hide");
      // An explicit value wins over the flip:  ?toggle=liveQA&value=true
      var forced = parseBoolParam(q.get("value") || q.get("state") || q.get("visible"));
      if (forced !== null) mode = forced ? "show" : "hide";
      this.set(function (s) {
        var b = s.boxes[key];
        b.visible = mode === "toggle" ? !b.visible : (mode === "show");
      });
      return { key: key, mode: mode, visible: this.state.boxes[key].visible };
    }
  };

  global.PG = PG;
})(window);

    function mapCatalogSym(sym,type,provider){
      if(type==="crypto"){ if(provider==="binance")return sym+"USDT"; if(provider==="finnhub")return "BINANCE:"+sym+"USDT"; if(provider==="twelvedata")return sym+"/USD"; return null; }
      if(type==="forex"){ if(provider==="finnhub")return "OANDA:"+sym.replace("/","_"); if(provider==="twelvedata")return sym; return null; }
      return provider==="binance"?null:sym;
    }
    function addSymbol(symbol,label){
      symbol=String(symbol||"").trim(); if(!symbol)return;
      var exists=(get("content.liveData.symbols")||[]).some(function(x){return String(x.symbol).toUpperCase()===symbol.toUpperCase();});
      if(exists){toast(symbol+" is already on the ticker");return;}
      PG.set(function(){var l=S.content.liveData.symbols||(S.content.liveData.symbols=[]);l.push({symbol:symbol,label:label||""});});
      toast(symbol+" added — press Update to publish");

      var p=get("content.liveData.provider"),key=get("content.liveData.apiKey")||"";
      try{
        if(p==="finnhub"&&key)return fetch("https://finnhub.io/api/v1/search?q="+encodeURIComponent(q)+"&token="+encodeURIComponent(key)).then(function(r){return r.json();}).then(function(j){return ((j&&j.result)||[]).slice(0,8).map(function(o){return {symbol:o.symbol,name:o.description,type:provTypeName(o.type)};});});
        if(p==="twelvedata")return fetch("https://api.twelvedata.com/symbol_search?symbol="+encodeURIComponent(q)+(key?"&apikey="+encodeURIComponent(key):"")).then(function(r){return r.json();}).then(function(j){return ((j&&j.data)||[]).slice(0,8).map(function(o){return {symbol:o.symbol,name:(o.instrument_name||"")+(o.exchange?" ("+o.exchange+")":""),type:provTypeName(o.instrument_type)};});});
        if(p==="alphavantage"&&key)return fetch("https://www.alphavantage.co/query?function=SYMBOL_SEARCH&keywords="+encodeURIComponent(q)+"&apikey="+encodeURIComponent(key)).then(function(r){return r.json();}).then(function(j){return ((j&&j.bestMatches)||[]).slice(0,8).map(function(o){return {symbol:o["1. symbol"],name:o["2. name"],type:"stock"};});});
        if(p==="polygon"&&key)return fetch("https://api.polygon.io/v3/reference/tickers?search="+encodeURIComponent(q)+"&active=true&limit=8&apiKey="+encodeURIComponent(key)).then(function(r){return r.json();}).then(function(j){return ((j&&j.results)||[]).map(function(o){return {symbol:o.ticker,name:o.name,type:"stock"};});});
        if(p==="binance")return binanceSyms().then(function(all){var Q=q.toUpperCase();return all.filter(function(s){return s.indexOf(Q)>=0;}).slice(0,8).map(function(s){return {symbol:s,name:"Binance pair",type:"crypto",label:s.replace(/USDT$/,"")};});});

              if(w>max||h>max){var s=Math.min(max/w,max/h);var cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);try{uri=cv.toDataURL("image/png");}catch(e){}}
              var p=nextPos();
              push({id:"ci"+Date.now(),type:"image",x:p.x,y:p.y,w:320,src:uri,z:800,animIn:"fade",animOut:"fade",bg:"transparent"});
            };
            img.src=rd.result;
          };

      function ciNum(it,prop,min,max,dflt){

      c.appendChild(el("p","mini","Live market data behaves the same way: the provider key is part of these settings, so once settings.js is in the folder the ticker starts by itself on any computer \u2014 no bridge and no control page needed."));
      return c;}

    function cardBridge(){var c=card("Companion / HTTP Control");
      c.appendChild(el("p","mini","Toggle banners from Bitfocus Companion, Stream Deck, or any HTTP client with GET / POST / PUT. Needs the bridge running: double-click Start Bridge Tray.vbs in this folder — no console window, just a green dot in the system tray (right-click it for menu; “Start with Windows” makes it automatic). Start Bridge.bat is the visible-console alternative. Point OBS at http://localhost:8787/overlay.html and this control page at http://localhost:8787/control.html."));
      var i=el("input");i.type="text";i.value=BRIDGE;
      i.addEventListener("change",function(){BRIDGE=i.value.trim()||"http://localhost:8787";try{localStorage.setItem("pte_bridge",BRIDGE);}catch(e){}pingBridge();toast("Bridge URL saved — reopen a tab to refresh copy URLs");});
      c.appendChild(row("Bridge base URL",i));
      var st=el("div");st.style.cssText="display:flex;align-items:center;gap:8px;margin:2px 0 6px";
      var dot=el("span");dot.style.cssText="width:9px;height:9px;border-radius:50%;background:#6a86a8;flex:0 0 auto";
      var lbl=el("span","mini","Checking…");st.appendChild(dot);st.appendChild(lbl);c.appendChild(st);
      window.pingBridge=function(){fetch(BRIDGE.replace(/\/+$/,"")+"/ping",{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){dot.style.background="var(--accent)";lbl.textContent="Connected · "+j.clients+" page(s) · port "+j.port;}).catch(function(){dot.style.background="var(--red)";lbl.textContent="Not running — double-click Start Bridge Tray.vbs in the overlay folder";});};
      pingBridge();setInterval(window.pingBridge,8000);
      var brow=el("div");brow.style.cssText="display:flex;gap:8px;margin-top:2px";
      var rc=el("button","btn sm","Recheck");rc.onclick=window.pingBridge;
      var oh=el("button","btn sm","Open bridge help");oh.onclick=function(){window.open(BRIDGE,"_blank");};
      brow.appendChild(rc);brow.appendChild(oh);c.appendChild(brow);
      c.appendChild(el("p","mini","Per-element URLs are on each row in the Elements tab: Copy URL flips, Copy true always shows, Copy false always hides \u2014 e.g. "+BRIDGE.replace(/\/+$/,"")+"/toggle/subscribe/true. Whole-look switches: "+BRIDGE.replace(/\/+$/,"")+"/preset/<name> and "+BRIDGE.replace(/\/+$/,"")+"/update (see Preset & Update URLs)."));
      return c;}

    function cardPerf(){var c=card("Performance");
      var r1=el("div","row");var b1=el("button","btn","⏸ Pause preview");b1.id="perfPause";b1.onclick=togglePause;r1.appendChild(b1);c.appendChild(r1);
      c.appendChild(el("p","mini","Marquees auto-pause in the preview after 3 minutes with no interaction, and pause fully when you click Pause. The overlay only re-renders content when displayed values change; the clock updates only when its text changes. OBS output is never throttled."));
      return c;}

    /* ---- preview selection sync ---- */
    function selectBoxRow(key){
      selectedBox=key;
      window.scrollTo(0,0);
      Array.prototype.slice.call(document.querySelectorAll(".boxrow")).forEach(function(n){n.classList.toggle("selected",n.dataset.box===key);});
      if(pv.contentWindow)try{pv.contentWindow.postMessage({type:"selectBox",key:key},"*");}catch(e){}
    }
    window.addEventListener("message",function(ev){
      var d=ev.data||{};
      if(d.type==="boxSelect"){selectedBox=d.key;
        Array.prototype.slice.call(document.querySelectorAll(".boxrow")).forEach(function(n){n.classList.toggle("selected",n.dataset.box===d.key);});}
      if(d.type==="boxDblClick"){jumpToBox(d.key);}
      if(d.type==="canvasItemDblClick"){jumpToCanvasItem(d.id);}
      if(d.type==="liveTestResult"){
        var o=document.getElementById("liveTestOut"), r=d.r||{};
        if(o){
          o.style.display="";
          if(r.ok){
            o.style.borderColor="var(--accent)";o.style.color="var(--txt)";
            var lines=["\u2713 Connected to "+provMeta().name+" in "+r.ms+" ms",
                       "Symbols returned: "+r.got+" of "+r.total+(r.first?"   (e.g. "+r.first+")":"")];
            if(r.missing&&r.missing.length)
              lines.push(r.rotating
                ? "Not yet fetched: "+r.missing.join(", ")+"  \u2014 they arrive on the next rotation cycles, not an error"
                : "No data for: "+r.missing.join(", ")+"  \u2014 check the symbol format for this provider ("+provMeta().symHint+")");
            else lines.push("All symbols returned data. Press Update to push this to the overlay.");
            if(r.note)lines.push("\u2139 "+r.note);
            o.textContent=lines.join("\n");
          }else{
            var why=String(r.msg||"unknown error"), tips=[];
            if(/^Waiting \d+s|daily allowance/i.test(why)){
              o.style.borderColor="var(--accent)";o.style.color="var(--txt)";
              o.textContent="\u2139 "+why+"\n\nThis is the built-in budget, not a provider error \u2014 every page sharing this key draws from one allowance, so the account is never rate-limited. "+
                "The ticker keeps showing the last prices meanwhile. Raise \u201CRefresh every\u201D or use fewer symbols to poll more often.";
              return;
            }
            o.style.borderColor="var(--red)";o.style.color="#ffb3c0";
            if(/CORS|blocked/i.test(why)) tips.push("This provider refuses requests straight from a browser. Binance, Finnhub, Twelve Data and Alpha Vantage all work; Alpaca does not.");
            if(/key rejected|401|403/i.test(why)) tips.push("Re-copy the key from the provider dashboard \u2014 no spaces, and make sure the plan covers these symbols.");
            if(/rate limit|429|calls\/day|credits/i.test(why)) tips.push("Raise \u201CRefresh every\u201D and cut the symbol list, then test again.");
            if(/format|not found|404/i.test(why)) tips.push("Symbol format for "+provMeta().name+": "+provMeta().symHint);
            if(!tips.length) tips.push("If this machine is offline the overlay keeps the last prices it saw.");
            o.textContent="\u2715 "+why+"\n\n"+tips.join("\n");
          }
        }
        return;
      }
      if(d.type==="liveStatus"){var st=document.getElementById("liveStatus");if(st){if(d.error){st.style.color="var(--red)";st.textContent="⚠ "+d.error;}else{st.style.color="var(--accent)";var t=d.ts?new Date(d.ts).toLocaleTimeString():"";st.textContent="✓ "+d.count+" symbol"+(d.count===1?"":"s")+" · "+t;}}}
    });
    function jumpToBox(key){
      if(key==="ticker"||key==="marketbar"){
        switchTab(1); // Market
        setTimeout(function(){
          var cardEl=document.querySelector(key==="ticker"?'[data-card="Stock Ticker Bar"]':'[data-card="Market Update Bar"]');
          if(!cardEl)return;
          cardEl.style.transition="box-shadow .3s";cardEl.style.boxShadow="0 0 0 2px var(--accent)";
          setTimeout(function(){cardEl.style.boxShadow="";},1400);
          var mr=main.getBoundingClientRect(), rr=cardEl.getBoundingClientRect();
          main.scrollTop += (rr.top - mr.top) - 14;
        },50);
        return;
      }
      switchTab(3); // Elements
      setTimeout(function(){
        var rowEl=document.querySelector('.boxrow[data-box="'+key+'"]');
        if(rowEl){
          rowEl.classList.add("open");
          selectBoxRow(key);
          rowEl.style.transition="box-shadow .3s";rowEl.style.boxShadow="0 0 0 2px var(--accent)";
          setTimeout(function(){rowEl.style.boxShadow="";},1400);
          var mr=main.getBoundingClientRect(), rr=rowEl.getBoundingClientRect();
          main.scrollTop += (rr.top - mr.top) - 14;
        }
      },50);
    }
    function jumpToCanvasItem(id){
      switchTab(4);
      setTimeout(function(){
        var rowEl=document.querySelector('.boxrow[data-citem="'+id+'"]');
        if(rowEl){
          rowEl.classList.add("open");
          rowEl.style.transition="box-shadow .3s";rowEl.style.boxShadow="0 0 0 2px var(--accent)";
          setTimeout(function(){rowEl.style.boxShadow="";},1400);
          var mr=main.getBoundingClientRect(), rr=rowEl.getBoundingClientRect();
          main.scrollTop += (rr.top - mr.top) - 14;
        }
      },60);
    }

    /* ---- tabs ---- */
    function switchTab(i){
      curTab=i;
      Array.prototype.slice.call(tabsNav.children).forEach(function(b,idx){b.classList.toggle("active",idx===i);});
      Array.prototype.slice.call(main.children).forEach(function(t,idx){t.classList.toggle("active",idx===i);});
    }
    function buildAll(){
      tabsNav.innerHTML="";main.innerHTML="";fields=[];
      TABS.forEach(function(name,i){
        var b=el("button",null,name);b.onclick=function(){switchTab(i);};tabsNav.appendChild(b);
        var t=buildTab(name);main.appendChild(t);
      });
      switchTab(curTab);
      fixSelectBooleans();
    }
    // selects bound to boolean paths need proper coercion
    function fixSelectBooleans(){
      fields.forEach(function(f){
        if(f.tagName==="SELECT"&&(f._path==="content.clock.format24")){
          f.value=String(get(f._path));
          f.onchange=function(){PG.set(function(){setPath(f._path,f.value==="true");});};
        }
        if(f.tagName==="SELECT"&&f._path==="canvas.resolution"){f.value=get(f._path);}
      });
    }

    /* ---- bottom bar ---- */
    var paused=false;
    function togglePause(){paused=!paused;pv.contentWindow.postMessage({type:"pausePreview",paused:paused},"*");
      var pp=document.getElementById("perfPause");if(pp)pp.textContent=paused?"▶ Resume preview":"⏸ Pause preview";}
    document.getElementById("btnUndo").onclick=function(){PG.undo();};
    document.getElementById("btnRedo").onclick=function(){PG.redo();};
    document.getElementById("btnGrid").onclick=function(){PG.set(function(){S.grid.show=!S.grid.show;});toast(S.grid.show?"Grid on":"Grid off");};
    document.getElementById("btnReset").onclick=function(){
      if(!PG.state.presets["Default"]){toast("No Default preset found");return;}
      if(confirm("Reset the editor to the “Default” preset? (Click Update afterward to push it to the overlay.)")){
        PG.loadPreset("Default");activePreset="Default";document.getElementById("presetIn").value="Default";
        toast("Loaded Default preset");updatePresetBtn();updateSaveBtn();
      }};

    // presets
    var presetIn=document.getElementById("presetIn");
    presetIn.addEventListener("input",updatePresetBtn);
    function updatePresetBtn(){
      var name=presetIn.value.trim();
      document.getElementById("btnPresetSave").textContent=(name&&PG.state.presets[name])?"Update":"Save";
    }
    // Custom upward-opening preset dropdown (no room below the bar for a native popup).
    var presetPop=document.getElementById("presetPop"),comboArrow=document.getElementById("comboArrow");
    function closePop(){presetPop.classList.remove("open");}
    function openPop(){
      presetPop.innerHTML="";
      var names=PG.presetNames();
      if(!names.length){presetPop.appendChild(el("div","empty","No presets saved yet"));}
      else names.forEach(function(n){
        var b=el("button",null,n);b.type="button";
        b.onclick=function(){presetIn.value=n;updatePresetBtn();closePop();PG.loadPreset(n);activePreset=n;toast("Loaded “"+n+"” — click Update to go live");updateSaveBtn();};
        presetPop.appendChild(b);
      });
      presetPop.classList.add("open");
      var r=document.querySelector(".combo").getBoundingClientRect();
      presetPop.style.left=r.left+"px";
      presetPop.style.width=r.width+"px";
      presetPop.style.bottom=(window.innerHeight-r.top+7)+"px";
    }
    comboArrow.onclick=function(e){e.stopPropagation();presetPop.classList.contains("open")?closePop():openPop();};
    document.addEventListener("click",function(e){if(!e.target.closest(".combo"))closePop();});
    document.getElementById("btnPresetLoad").onclick=function(){
      var name=presetIn.value.trim();
      if(!name||!PG.state.presets[name]){toast("Type or pick an existing preset to load");return;}
      PG.loadPreset(name);activePreset=name;toast("Loaded “"+name+"” — click the dot to go live");updatePresetBtn();updateSaveBtn();
    };
    document.getElementById("btnPresetDelete").onclick=function(){
      var name=presetIn.value.trim();
      if(!name||!PG.state.presets[name]){toast("Type or pick an existing preset to delete");return;}
      if(name==="Default"){toast("The Default preset can’t be deleted");return;}
      if(!confirm("Delete preset “"+name+"”?"))return;
      PG.deletePreset(name);if(activePreset===name)activePreset=null;
      refreshPresets();presetIn.value="";toast("Preset deleted");updatePresetBtn();
    };
    document.getElementById("btnPresetSave").onclick=function(){
      var name=presetIn.value.trim();
      if(!name){toast("Type a preset name first");presetIn.focus();return;}
      var existed=!!PG.state.presets[name];
      PG.savePreset(name);activePreset=name;
      refreshPresets();presetIn.value=name;toast(existed?("Updated “"+name+"”"):("Saved “"+name+"”"));updatePresetBtn();
    };
    document.getElementById("btnSave").onclick=function(){
      if(!PG.isDirty()){toast("Overlay already up to date");return;}
      PG.publish();relayState();toast("Overlay updated");updateSaveBtn();
    };
    /* ---- one-click URLs: presets + Update -------------------------------
       /preset/<name> loads a preset AND publishes it; /update publishes the
       current draft. Both arrive over the bridge SSE stream, so a Stream Deck
       button changes the whole look with one press. */
    function presetUrl(name){ return BRIDGE.replace(/\/+$/,"")+"/preset/"+encodeURIComponent(name); }
    function updateUrl(){ return BRIDGE.replace(/\/+$/,"")+"/update"; }
    function copyText(t,msg){ try{ navigator.clipboard&&navigator.clipboard.writeText(t); }catch(e){} toast(msg); }
    function relayState(){
      try{
        var body=JSON.stringify({state:PG.state});
        if(body.length>6000000)return;              // don't shove huge payloads through the bridge
        fetch(BRIDGE.replace(/\/+$/,"")+"/state",{method:"POST",headers:{"Content-Type":"application/json"},body:body}).catch(function(){});
      }catch(e){}
    }
    function applyPresetLive(name){
      var hit=null;
      PG.presetNames().forEach(function(n){ if(!hit&&n.toLowerCase()===String(name||"").trim().toLowerCase())hit=n; });
      if(!hit){ toast("No preset named \u201C"+name+"\u201D"); return false; }
      PG.loadPreset(hit); activePreset=hit; presetIn.value=hit;
      PG.publish(); relayState();
      updatePresetBtn(); updateSaveBtn();
      toast("Preset \u201C"+hit+"\u201D is live");
      return true;
    }
    document.getElementById("btnPresetUrl").onclick=function(){
      var name=presetIn.value.trim();
      if(!name||!PG.state.presets[name]){toast("Pick or save a preset first");return;}
      copyText(presetUrl(name),"Preset URL copied");
    };
    document.getElementById("btnUpdateUrl").onclick=function(){ copyText(updateUrl(),"Update URL copied"); };
    (function(){
      var es; try{ es=new EventSource(BRIDGE.replace(/\/+$/,"")+"/events"); }catch(e){ return; }
      es.addEventListener("cmd",function(ev){
        var d; try{ d=JSON.parse(ev.data); }catch(e){ return; }
        if(!d)return;
        if(d.cmd==="preset"){ applyPresetLive(d.name); }
        else if(d.cmd==="publish"){ PG.publish(); relayState(); updateSaveBtn(); toast("Overlay updated"); }
      });
      es.onerror=function(){ /* auto-reconnects; quiet when the bridge is off */ };
    })();

    function refreshPresets(){
      updatePresetBtn();
      if(presetPop.classList.contains("open"))openPop();
    }
    function updateSaveBtn(){
      var dirty=PG.isDirty();
      document.getElementById("pubDot").className=dirty?"status dirty":"status saved";
      var btn=document.getElementById("btnSave");
      btn.disabled=!dirty;
      btn.title=dirty?"Publish your changes to the overlay (OBS)":"Overlay is up to date";
    }

    function refreshChrome(){
      document.getElementById("btnUndo").disabled=!PG.canUndo();
      document.getElementById("btnRedo").disabled=!PG.canRedo();
      document.getElementById("btnGrid").style.color=S.grid.show?"var(--accent)":"";
      refreshPresets();updateSaveBtn();
    }

    /* ---- inactivity auto-pause (3 min) ---- */
    var lastActivity=Date.now(),autoPaused=false;
    ["mousemove","keydown","click","input","touchstart"].forEach(function(evt){
      document.addEventListener(evt,function(){lastActivity=Date.now();if(autoPaused){autoPaused=false;if(!paused)pv.contentWindow.postMessage({type:"marqueeIdle",paused:false},"*");}},{passive:true});
    });
    setInterval(function(){
      if(!paused&&!autoPaused&&Date.now()-lastActivity>180000){autoPaused=true;pv.contentWindow.postMessage({type:"marqueeIdle",paused:true},"*");}
    },5000);

    /* keyboard undo/redo on control too */
    document.addEventListener("keydown",function(e){
      if(e.target.matches&&e.target.matches("input,textarea,select"))return;
      var mod=e.ctrlKey||e.metaKey;
      if(mod&&e.key.toLowerCase()==="z"&&!e.shiftKey){e.preventDefault();PG.undo();}
      else if(mod&&(e.key.toLowerCase()==="y"||(e.shiftKey&&e.key.toLowerCase()==="z"))){e.preventDefault();PG.redo();}
    });

    /* ---- init ---- */
    PG.init(function(s){
      S=s;
      // Seed a "Default" preset once, capturing the shipped defaults.
      if(!s.presets||!s.presets["Default"]){
        var snap=JSON.parse(JSON.stringify(PG.defaults()));delete snap.presets;
        PG.set(function(st){st.presets["Default"]=snap;},{history:false});
      }
      buildAll();refreshChrome();
    });
    PG.subscribe(function(s,remote){
      S=s;
      // if structure changed (preset load / reset), rebuild; else refresh values
      refreshFields();
      extraRefreshers.forEach(function(fn){try{fn();}catch(e){}});
      // update range displays
      fields.forEach(function(f){if(f._range)f._range.textContent=f.value+(f._unit||"");});
      refreshChrome();
      // update swatch selection + logo state without full rebuild
      Array.prototype.slice.call(document.querySelectorAll(".boxrow[data-box]")).forEach(function(rw){
        var key=rw.dataset.box; if(!key||!S.boxes[key])return;
        rw.querySelectorAll(".swatch").forEach(function(sw){sw.classList.toggle("on",S.boxes[key].bg===sw.title);});
      });
    });
  })();
  </script>
</body>
</html>
